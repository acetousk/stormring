name: A question
description: You do not know how to do something in the game.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Check the FAQ first (FAQ.md on the game's page). **Do not write your real name, age, school, or where you live.**
  - type: textarea
    id: question
    attributes:
      label: What do you want to know?
      placeholder: How do I join my friend's room?
    validations:
      required: true
