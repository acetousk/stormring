<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Stormring icon. Palette only: Dark, Water, Sand, Grass, Storm purple. -->
  <rect width="256" height="256" rx="48" fill="#264653"/>
  <!-- Sea -->
  <circle cx="128" cy="128" r="104" fill="#2A9D8F"/>
  <!-- Island: sand beach, grass on top -->
  <circle cx="128" cy="128" r="66" fill="#E9C46A"/>
  <circle cx="128" cy="124" r="52" fill="#6A994E"/>
  <!-- Two box buildings -->
  <rect x="98" y="104" width="22" height="22" rx="3" fill="#264653"/>
  <rect x="136" y="128" width="26" height="20" rx="3" fill="#264653"/>
  <!-- The storm ring closing in -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#7B2CBF" stroke-width="14"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#7B2CBF" stroke-width="30" stroke-opacity="0.35"/>
</svg>
